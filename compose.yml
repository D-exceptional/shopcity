services:

  # ==========================================================
  # PHP APPLICATION
  # ==========================================================

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce_app

    working_dir: /var/www

    volumes:
      - .:/var/www

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - framework

  # ==========================================================
  # NGINX
  # ==========================================================

  nginx:
    image: nginx:alpine

    container_name: ecommerce_nginx_server

    ports:
      - "8080:80"

    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - framework

  # ==========================================================
  # MYSQL
  # ==========================================================

  mysql:
    image: mysql:8.4

    container_name: ecommerce_mysql_database

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-framework}
      MYSQL_USER: ${DB_USERNAME:-framework}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-root}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - framework

  # ==========================================================
  # REDIS
  # ==========================================================

  redis:
    image: redis:7-alpine

    container_name: ecommerce_redis_server

    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - framework

  # ==========================================================
  # PHPMYADMIN
  # ==========================================================

  phpmyadmin:
    image: phpmyadmin:latest

    container_name: ecommerce_phpmyadmin_client

    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-framework}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}

    ports:
      - "8081:80"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - framework

  # ==========================================================
  # EMAIL WORKER
  # ==========================================================

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce_email_worker

    working_dir: /var/www

    command: php queue-work.php email

    volumes:
      - .:/var/www

    depends_on:
      redis:
        condition: service_healthy

      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - framework

  # ==========================================================
  # PUSH WORKER
  # ==========================================================

  push-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce_push_worker

    working_dir: /var/www

    command: php queue-work.php push

    volumes:
      - .:/var/www

    depends_on:
      redis:
        condition: service_healthy

      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - framework

  # ==========================================================
  # OTP WORKER
  # ==========================================================

  otp-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce_otp_worker

    working_dir: /var/www

    command: php queue-work.php otp

    volumes:
      - .:/var/www

    depends_on:
      redis:
        condition: service_healthy

      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - framework

  # ==========================================================
  # BROADCAST WORKER
  # ==========================================================

  broadcast-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce_broadcast_worker

    working_dir: /var/www

    command: php queue-work.php broadcast

    volumes:
      - .:/var/www

    depends_on:
      redis:
        condition: service_healthy

      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - framework

# ============================================================
# NETWORKS
# ============================================================

networks:

  framework:
    driver: bridge

# ============================================================
# PERSISTENT VOLUMES
# ============================================================

volumes:

  mysql_data:

  redis_data: