services:

  # ==========================================================
  # PHP APPLICATION
  # ==========================================================

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopcity_app

    working_dir: /var/www

    volumes:
      - .:/var/www

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - framework

  # ==========================================================
  # NGINX
  # ==========================================================

  nginx:
    image: nginx:alpine

    container_name: shopcity_nginx_server

    ports:
      - "8080:80"

    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - framework

  # ==========================================================
  # MYSQL
  # ==========================================================

  mysql:
    image: mysql:8.4

    container_name: shopcity_mysql_database

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}  
      MYSQL_USER: ${DB_USERNAME}   
      MYSQL_PASSWORD: ${DB_PASSWORD}  
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD} 

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - framework

  # ==========================================================
  # REDIS
  # ==========================================================

  redis:
    image: redis:7-alpine

    container_name: shopcity_redis_server

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - framework

  # ==========================================================
  # PHPMYADMIN
  # ==========================================================

  phpmyadmin:
    image: phpmyadmin:latest

    container_name: shopcity_phpmyadmin_client

    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

      # These last two are disabled so you can manually decide the how you want to access the MySQL server.
      # By disabling these options, you'll manually go to the browser to login to MySQL server.

      # If you want to access it as administrator,    
        # set PMA_USER: and PMA_PASSWORD: to `root` and `${DB_ROOT_PASSWORD}` respectively

      # If you want to access it as a client instead, 
        # set PMA_USER: and PMA_PASSWORD: to `${DB_USERNAME}` and  `${DB_PASSWORD}` respectively

      # PMA_USER: ${DB_USERNAME}   
      # PMA_PASSWORD: ${DB_PASSWORD} 

    ports:
      - "8081:80"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - framework

  # ==========================================================
  # EMAIL WORKER
  # ==========================================================

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopcity_email_worker

    working_dir: /var/www

    command: php app/Console/queue-work.php email

    volumes:
      - .:/var/www

    depends_on:
      redis:
        condition: service_healthy

      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - framework

  # ==========================================================
  # PUSH WORKER
  # ==========================================================

  push-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopcity_push_worker

    working_dir: /var/www

    command: php app/Console/queue-work.php push

    volumes:
      - .:/var/www

    depends_on:
      redis:
        condition: service_healthy

      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - framework

  # ==========================================================
  # OTP WORKER
  # ==========================================================

  otp-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopcity_otp_worker

    working_dir: /var/www

    command: php app/Console/queue-work.php otp

    volumes:
      - .:/var/www

    depends_on:
      redis:
        condition: service_healthy

      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - framework

  # ==========================================================
  # BROADCAST WORKER
  # ==========================================================

  broadcast-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopcity_broadcast_worker

    working_dir: /var/www

    command: php app/Console/queue-work.php broadcast

    volumes:
      - .:/var/www

    depends_on:
      redis:
        condition: service_healthy

      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - framework

  # ==========================================================
  # BROADCAST WORKER
  # ==========================================================

  cloudinary-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopcity_cloudinary_worker

    working_dir: /var/www

    command: php app/Console/queue-work.php cloudinary

    volumes:
      - .:/var/www

    depends_on:
      redis:
        condition: service_healthy

      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - framework

# ============================================================
# NETWORKS
# ============================================================

networks:

  framework:
    driver: bridge

# ============================================================
# PERSISTENT VOLUMES
# ============================================================

volumes:

  mysql_data:

  redis_data: